hostname Core_SW1
!
enable password corepass123
no service password-encryption
ip routing
!
vlan 10
 name Corporate_Users
!
vlan 20
 name Engineering_Dev
!
vlan 30
 name Server_Farm_DC
!
interface GigabitEthernet0/1
 description Routed-Uplink-to-Edge-R1
 no switchport
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description Interconnect-to-Core-SW2
 no switchport
 ip address 10.0.0.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0/1
 description Trunk-Uplink-to-Dist-Access-SW1
 switchport mode trunk
 switchport trunk allowed vlan 1,10,20
 no shutdown
!
interface GigabitEthernet1/0/2
 description Trunk-Uplink-to-ServerFarm-SW
 switchport mode trunk
 switchport trunk allowed vlan 30
 no shutdown
!
interface Vlan10
 description Gateway-Corporate-Users
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description Gateway-Engineering-Dev
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description Gateway-DataCenter-Servers
 ip address 192.168.30.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
!
line con 0
 password switchcon
 login
!
line vty 0 4
 transport input telnet
 login
!
end

! ==============================================================================
! DEVICE 3: Core_SW2.cfg (Secondary Core / Redundant Distribution Switch)
! ==============================================================================
version 15.2
