hostname Dist_Access_SW1
!
enable password switchuserpass
no service password-encryption
!
vlan 1
 name default
!
vlan 10
 name Corporate_Users
!
vlan 20
 name Guest_Wireless
!
interface GigabitEthernet0/1
 description Trunk-to-Core-SW1
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20
 no shutdown
!
interface FastEthernet0/1
 description Workstation-PC-01
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/2
 description Workstation-PC-02
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface FastEthernet0/3
 description Guest-Laptop-01
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface FastEthernet0/4
 description Inactive-Port-Unused
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface FastEthernet0/5
 description Inactive-Port-Unused
 switchport mode access
 switchport access vlan 1
 no shutdown
!
line con 0
 password userpass
 login
!
line vty 0 4
 transport input telnet
 login
!
end

