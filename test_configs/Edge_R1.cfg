! ==============================================================================
! DEVICE 1: Edge_R1.cfg (Perimeter Router / WAN Gateway)
! ==============================================================================
version 15.4
hostname Edge_R1
!
enable password cisco_insecure_pass
no service password-encryption
!
ip domain-name enterprise.net
!
interface GigabitEthernet0/0
 description WAN-Uplink-to-Internet-ISP
 ip address 203.0.113.2 255.255.255.252
 ip access-group PERIMETER_IN in
 no shutdown
!
interface GigabitEthernet0/1
 description P2P-Link-to-Core-SW1
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description P2P-Link-to-Core-SW2
 ip address 10.0.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description DMZ-Public-Facing-Services
 ip address 192.168.100.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/4
 no shutdown
!
interface GigabitEthernet0/5
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 192.168.100.0 0.0.0.255 area 0
 default-information originate
!
! VULNERABLE OVERLY-PERMISSIVE ACL (Allows arbitrary traffic through perimeter)
ip access-list extended PERIMETER_IN
 permit ip any any
 permit tcp any host 192.168.100.10 eq 80
 permit tcp any host 192.168.100.10 eq 443
!
line con 0
 password consolepass
 login
!
line vty 0 4
 transport input telnet
 password vtyinsecure
 login
!
end

! ==============================================================================
! DEVICE 2: Core_SW1.cfg (Primary Core / Distribution L3 Switch)
! ==============================================================================
version 15.2
