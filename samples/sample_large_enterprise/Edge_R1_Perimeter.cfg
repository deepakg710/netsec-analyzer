! =====================================================================
! Device: Edge-R1 (Enterprise Perimeter / Border Router)
! Architecture: Multi-Tier Campus Enterprise
! Function: WAN Termination, Perimeter Firewall ACL, DMZ Gateway, OSPF
! =====================================================================
hostname Edge-R1
!
enable secret 9 $9$Kx8Z3q7Lp1mN.v$8xT8gY7o9P1aQ2c
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
!
ip domain-name enterprise.net
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner motd ^C
=============================================================
 WARNING: AUTHORIZED CORPORATE ACCESS ONLY. ALL SESSIONS LOGGED.
 UNAUTHORIZED USE IS STRICTLY PROHIBITED AND MONITORED.
=============================================================
^C
!
! --- WAN Perimeter Interface ---
interface GigabitEthernet0/0
 description WAN-Uplink-to-Primary-ISP-Tier1
 ip address 203.0.113.2 255.255.255.252
 ip access-group WAN-INBOUND in
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no shutdown
!
! --- DMZ Interface ---
interface GigabitEthernet0/1
 description DMZ-Public-Facing-Services
 ip address 192.168.100.1 255.255.255.0
 ip access-group DMZ-FILTER in
 no ip redirects
 no shutdown
!
! --- Internal Core Interconnect 1 ---
interface GigabitEthernet0/2
 description P2P-Link-to-Core-SW1
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
! --- Internal Core Interconnect 2 (Redundant) ---
interface GigabitEthernet0/3
 description P2P-Link-to-Core-SW2
 ip address 10.0.0.5 255.255.255.252
 no shutdown
!
! --- Static Default Route to ISP ---
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! --- OSPF Dynamic Routing for Internal Subnets ---
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 192.168.100.0 0.0.0.255 area 0
 default-information originate
!
! --- Perimeter Inbound Access List ---
ip access-list extended WAN-INBOUND
 remark === Block spoofed internal IP addresses from WAN ===
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip 127.0.0.0 0.255.255.255 any log
 remark === Allow Inbound Web & Mail to DMZ Servers only ===
 permit tcp any host 192.168.100.10 eq 80
 permit tcp any host 192.168.100.10 eq 443
 permit tcp any host 192.168.100.25 eq 25
 remark === Allow Return Traffic (Established Sessions) ===
 permit tcp any any established
 permit icmp any any echo-reply
 remark === Explicit Deny All from Internet ===
 deny ip any any log
!
! --- DMZ Security Policy ---
ip access-list extended DMZ-FILTER
 remark === DMZ servers can only reply to WAN or query Internal DNS ===
 permit udp host 192.168.100.10 host 192.168.30.10 eq 53
 permit tcp host 192.168.100.10 host 192.168.30.20 eq 3306
 deny ip 192.168.100.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 192.168.100.0 0.0.0.255 any
!
! --- Secure Management Plane ---
line con 0
 exec-timeout 5 0
 transport output none
 login local
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
