! =====================================================================
! Device: DC-ServerFarm-SW (Data Center Server Farm Switch)
! Architecture: Multi-Tier Campus Enterprise
! Function: Data Center Server Farm Connectivity, Strict Port Policy
! =====================================================================
hostname DC-ServerFarm-SW
!
enable secret 9 $9$Q4eG9w3Rv7sT.b$4dZ4mE3u5V7gW8i
service password-encryption
!
spanning-tree mode rapid-pvst
!
ip domain-name enterprise.net
crypto key generate rsa modulus 2048
ip ssh version 2
!
banner motd ^C
=============================================================
 CRITICAL DATA CENTER SWITCH - STRICT ACCESS CONTROLS APPLIED
=============================================================
^C
!
vlan 30
 name DataCenter-Servers
vlan 99
 name Network-Management
!
! --- Primary Uplink to Core-SW1 ---
interface GigabitEthernet0/1
 description Trunk-Uplink-to-Core-SW1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99
 no shutdown
!
! --- Secondary Uplink to Core-SW2 ---
interface GigabitEthernet0/2
 description Redundant-Uplink-to-Core-SW2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99
 no shutdown
!
! --- Server Farm Dedicated Ports ---
interface GigabitEthernet1/0/1
 description Primary-DomainController-AD-DNS
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 no shutdown
!
interface GigabitEthernet1/0/2
 description Enterprise-Database-Cluster-SQL
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 no shutdown
!
interface GigabitEthernet1/0/3
 description Core-Banking-ERP-AppServer
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 no shutdown
!
! --- Management SVI ---
interface Vlan99
 description Switch-Management-Interface
 ip address 10.99.0.30 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.0.1
!
! --- Line Security ---
line con 0
 exec-timeout 5 0
 login local
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
