! =====================================================================
! Device: Dist-Access-BldgA (Building A Distribution/Access Switch)
! Architecture: Multi-Tier Campus Enterprise
! Function: Corporate User Access, Port Security, Dual Core Uplinks
! =====================================================================
hostname Dist-Access-BldgA
!
enable secret 9 $9$O2cE7u1Pt5qR.z$2bX2kC1s3T5eU6g
service password-encryption
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
ip domain-name enterprise.net
crypto key generate rsa modulus 2048
ip ssh version 2
!
banner motd ^C
=============================================================
 BUILDING A ACCESS SWITCH - CORPORATE ENDPOINTS
=============================================================
^C
!
vlan 10
 name Corporate-Users
vlan 50
 name VoIP-Phones
vlan 99
 name Network-Management
!
! --- Primary Uplink to Core-SW1 ---
interface GigabitEthernet0/1
 description Trunk-Uplink-to-Core-SW1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99
 no shutdown
!
! --- Secondary Uplink to Core-SW2 ---
interface GigabitEthernet0/2
 description Redundant-Uplink-to-Core-SW2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99
 no shutdown
!
! --- Corporate User Access Ports ---
interface FastEthernet0/1
 description Finance-Workstation-01
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface FastEthernet0/2
 description HR-Workstation-02
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface FastEthernet0/3
 description Executive-Office-03
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
! --- Management SVI ---
interface Vlan99
 description Switch-Management-Interface
 ip address 10.99.0.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.0.1
!
! --- Line Security ---
line con 0
 exec-timeout 5 0
 login local
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
