! =====================================================================
! Device: Dist-Access-BldgB (Building B Distribution/Access Switch)
! Architecture: Multi-Tier Campus Enterprise
! Function: Engineering Lab & Guest Wi-Fi AP Access
! =====================================================================
hostname Dist-Access-BldgB
!
enable secret 9 $9$P3dF8v2Qu6rS.a$3cY3lD2t4U6fV7h
service password-encryption
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
ip domain-name enterprise.net
crypto key generate rsa modulus 2048
ip ssh version 2
!
banner motd ^C
=============================================================
 BUILDING B ACCESS SWITCH - R&D AND WIRELESS
=============================================================
^C
!
vlan 20
 name Engineering-Dev
vlan 40
 name Guest-Wireless
vlan 99
 name Network-Management
!
! --- Primary Uplink to Core-SW1 ---
interface GigabitEthernet0/1
 description Trunk-Uplink-to-Core-SW1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,40,99
 no shutdown
!
! --- Secondary Uplink to Core-SW2 ---
interface GigabitEthernet0/2
 description Redundant-Uplink-to-Core-SW2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,40,99
 no shutdown
!
! --- Engineering Lab Access Ports ---
interface FastEthernet0/1
 description Dev-Workstation-Lab1
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
interface FastEthernet0/2
 description Dev-Workstation-Lab2
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
! --- Guest Wi-Fi AP Port ---
interface FastEthernet0/24
 description Guest-WiFi-AccessPoint-Lobby
 switchport mode access
 switchport access vlan 40
 no shutdown
!
! --- Management SVI ---
interface Vlan99
 description Switch-Management-Interface
 ip address 10.99.0.12 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.0.1
!
! --- Line Security ---
line con 0
 exec-timeout 5 0
 login local
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
