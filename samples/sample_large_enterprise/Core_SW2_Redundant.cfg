! =====================================================================
! Device: Core-SW2 (Secondary Redundant Core Switch)
! Architecture: Multi-Tier Campus Enterprise
! Function: Core High Availability, Redundant Routing, Backup Gateways
! =====================================================================
hostname Core-SW2
!
enable secret 9 $9$N1bD6t0Os4pQ.y$1aW1jB0r2S4dT5f
service password-encryption
!
ip routing
spanning-tree mode rapid-pvst
spanning-tree vlan 1-99 priority 8192
!
ip domain-name enterprise.net
crypto key generate rsa modulus 2048
ip ssh version 2
!
banner motd ^C
=============================================================
 WARNING: CORE SWITCH 2 - REDUNDANT BACKBONE. AUTHORIZED ONLY.
=============================================================
^C
!
! --- Enterprise VLAN Database (Mirrored) ---
vlan 10
 name Corporate-Users
vlan 20
 name Engineering-Dev
vlan 30
 name DataCenter-Servers
vlan 40
 name Guest-Wireless
vlan 99
 name Network-Management
!
! --- Routed Uplink to Edge-R1 ---
interface GigabitEthernet0/1
 description Routed-Uplink-to-Edge-R1
 no switchport
 ip address 10.0.0.6 255.255.255.252
 no shutdown
!
! --- Routed Inter-Core Link to Core-SW1 ---
interface GigabitEthernet0/2
 description Routed-Interconnect-to-Core-SW1
 no switchport
 ip address 10.0.0.10 255.255.255.252
 no shutdown
!
! --- Redundant 802.1Q Trunk to Building A ---
interface GigabitEthernet1/0/1
 description Redundant-Trunk-to-Dist-Access-BldgA
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99
 no shutdown
!
! --- Redundant 802.1Q Trunk to Building B ---
interface GigabitEthernet1/0/2
 description Redundant-Trunk-to-Dist-Access-BldgB
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,40,99
 no shutdown
!
! --- Redundant 802.1Q Trunk to Data Center Switch ---
interface GigabitEthernet1/0/3
 description Redundant-Trunk-to-DC-ServerFarm-SW
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99
 no shutdown
!
! --- Layer-3 SVI Gateways (Secondary Peer) ---
interface Vlan10
 description Gateway-Corporate-Users-Secondary
 ip address 192.168.10.2 255.255.255.0
 no shutdown
!
interface Vlan20
 description Gateway-Engineering-Dev-Secondary
 ip address 192.168.20.2 255.255.255.0
 no shutdown
!
interface Vlan30
 description Gateway-DataCenter-Servers-Secondary
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
interface Vlan40
 description Gateway-Guest-Wireless-Secondary
 ip address 192.168.40.2 255.255.255.0
 no shutdown
!
interface Vlan99
 description Gateway-Out-Of-Band-Management
 ip address 10.99.0.2 255.255.255.0
 no shutdown
!
! --- Core OSPF Routing ---
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 10.99.0.0 0.0.0.255 area 0
!
! --- Secure Management Plane ---
line con 0
 exec-timeout 5 0
 login local
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
