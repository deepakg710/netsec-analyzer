! Cisco IOS Running-Config — Hardened Enterprise Branch Router
hostname R1
!
enable secret 9 $9$Kx8Z3q7Lp1mN.v$8xT8gY7o9P1aQ2c
service password-encryption
!
ip domain-name corp.internal
ip ssh version 2
!
interface GigabitEthernet0/0
 description WAN-Uplink
 ip address 203.0.113.2 255.255.255.252
 ip access-group 100 in
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-VLAN10-20-Trunk
 ip address 192.168.1.1 255.255.255.0
 ip access-group 101 in
 no shutdown
!
interface GigabitEthernet0/2
 description LAN-VLAN30-Servers
 ip address 192.168.30.1 255.255.255.0
 ip access-group 102 in
 no shutdown
!
interface FastEthernet0/3
 shutdown
!
interface FastEthernet0/4
 shutdown
!
interface FastEthernet0/5
 shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 192.168.10.0 255.255.255.0 192.168.1.2
ip route 192.168.20.0 255.255.255.0 192.168.1.2
!
! Hardened least-privilege perimeter access-list
access-list 100 permit tcp any host 203.0.113.2 eq 443
access-list 100 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq 443
access-list 100 deny ip any any log
!
access-list 101 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq 443
access-list 101 deny ip any any log
!
access-list 102 permit tcp 192.168.30.0 0.0.0.255 any established
access-list 102 deny ip any any log
!
line con 0
 login local
!
line vty 0 4
 transport input ssh
 login local
!
end
